name: Release build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  linux:
    name: Linux x64
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf \
            automake \
            libtool \
            gettext \
            libsqlite3-dev

      - name: Configure
        run: |
          autoreconf -i -f
          ./configure

      - name: Build
        run: make -j2

      - name: Package
        run: |
          mkdir -p dist/fmptools-linux-x64
          cp fmp2sqlite dist/fmptools-linux-x64/
          cp fmpdump dist/fmptools-linux-x64/
          tar -C dist -czf dist/fmptools-linux-x64.tar.gz fmptools-linux-x64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fmptools-linux-x64
          path: dist/fmptools-linux-x64.tar.gz

  macos:
    name: macOS ARM64
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install automake libtool gettext sqlite

      - name: Configure
        run: |
          autoreconf -i -f -I "$(brew --prefix gettext)/share/gettext/m4"
          ./configure
        env:
          CPPFLAGS: -I/opt/homebrew/include
          LDFLAGS: -L/opt/homebrew/lib

      - name: Build
        run: make -j2

      - name: Package
        run: |
          mkdir -p dist/fmptools-macos-arm64
          cp fmp2sqlite dist/fmptools-macos-arm64/
          cp fmpdump dist/fmptools-macos-arm64/
          tar -C dist -czf dist/fmptools-macos-arm64.tar.gz fmptools-macos-arm64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fmptools-macos-arm64
          path: dist/fmptools-macos-arm64.tar.gz

  windows:
    name: Windows x64
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf \
            automake \
            libtool \
            gettext \
            mingw-w64 \
            win-iconv-mingw-w64-dev \
            wget \
            unzip \
            zip \
            cmake

      - name: Build Windows SQLite
        run: |
          wget https://www.sqlite.org/2026/sqlite-autoconf-3530400.tar.gz
          tar xf sqlite-autoconf-3530400.tar.gz

          cd sqlite-autoconf-3530400

          ./configure \
            --host=x86_64-w64-mingw32 \
            --prefix="$GITHUB_WORKSPACE/win64" \
            --disable-shared \
            --enable-static

          make -j2
          make install

      - name: Build Windows YAJL
        run: |
          git clone https://github.com/lloyd/yajl.git
          cd yajl

          sed -i 's/IF (WIN32)/IF (WIN32 AND MSVC)/' CMakeLists.txt
          sed -i 's/ELSE (WIN32)/ELSE (WIN32 AND MSVC)/' CMakeLists.txt
          sed -i 's/ENDIF (WIN32)/ENDIF (WIN32 AND MSVC)/' CMakeLists.txt

          cmake -S . -B build \
            -DCMAKE_SYSTEM_NAME=Windows \
            -DCMAKE_C_COMPILER=x86_64-w64-mingw32-gcc \
            -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/win64" \
            -DBUILD_SHARED_LIBS=OFF

          cmake --build build -j2
          cmake --install build

      - name: Configure
        run: |
          autoreconf -i -f

          CPPFLAGS="-I$GITHUB_WORKSPACE/win64/include -I/usr/x86_64-w64-mingw32/include" \
          LDFLAGS="-L$GITHUB_WORKSPACE/win64/lib -L/usr/x86_64-w64-mingw32/lib" \
          LIBS="-liconv" \
          ./configure \
            --host=x86_64-w64-mingw32 \
            --disable-shared \
            --enable-static

      - name: Build
        run: make -j2

      - name: Verify Windows tools
        run: |
          ls -l *.exe
          file fmp2sqlite.exe
          file fmpdump.exe
          file fmp2json.exe
          
      - name: Package
        run: |
          mkdir -p dist/fmptools-windows-x64

          cp fmp2sqlite.exe dist/fmptools-windows-x64/
          cp fmpdump.exe dist/fmptools-windows-x64/
          cp /usr/x86_64-w64-mingw32/bin/iconv.dll dist/fmptools-windows-x64/

          cd dist
          zip -r fmptools-windows-x64.zip fmptools-windows-x64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fmptools-windows-x64
          path: dist/fmptools-windows-x64.zip

  publish:
    name: Publish GitHub Release
    needs:
      - linux
      - macos
      - windows

    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Prepare release files
        run: |
          mkdir -p release

          cp dist/fmptools-linux-x64/fmptools-linux-x64.tar.gz release/
          cp dist/fmptools-macos-arm64/fmptools-macos-arm64.tar.gz release/
          cp dist/fmptools-windows-x64/fmptools-windows-x64.zip release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/fmptools-linux-x64.tar.gz
            release/fmptools-macos-arm64.tar.gz
            release/fmptools-windows-x64.zip
          generate_release_notes: true
