name: Windows build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - windows-ci
  pull_request:
    branches:
      - main

jobs:
  build-windows:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf \
            automake \
            libtool \
            gettext \
            mingw-w64 \
            win-iconv-mingw-w64-dev \
            wget \
            unzip \
            zip

      - name: Build Windows SQLite
        run: |
          wget https://www.sqlite.org/2026/sqlite-autoconf-3530400.tar.gz
          tar xzf sqlite-autoconf-3530400.tar.gz
          cd sqlite-autoconf-3530400

          ./configure \
            --host=x86_64-w64-mingw32 \
            --prefix="$GITHUB_WORKSPACE/win64" \
            --disable-shared \
            --enable-static

          make -j2
          make install

      - name: Configure fmptools
        run: |
          autoreconf -i -f

          CPPFLAGS="-I$GITHUB_WORKSPACE/win64/include -I/usr/x86_64-w64-mingw32/include" \
          LDFLAGS="-L$GITHUB_WORKSPACE/win64/lib -L/usr/x86_64-w64-mingw32/lib" \
          LIBS="-liconv" \
          ./configure \
            --host=x86_64-w64-mingw32 \
            --disable-shared \
            --enable-static

      - name: Build fmptools
        run: make -j2

      - name: Verify Windows binary
        run: |
          file fmp2sqlite.exe
          x86_64-w64-mingw32-objdump -p fmp2sqlite.exe | grep "DLL Name"

      - name: Package
        run: |
          mkdir -p dist
          cp fmp2sqlite.exe dist/
          cp /usr/x86_64-w64-mingw32/bin/iconv.dll dist/
          cd dist
          zip fmp2sqlite-win64.zip fmp2sqlite.exe iconv.dll

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fmp2sqlite-win64
          path: dist/fmp2sqlite-win64.zip
